<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact UMAT</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;700;900&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
    <style>
        .form-group { margin-bottom: 20px; }
        label { display:block; font-weight:bold; margin-bottom:5px; }
        input, textarea { width:100%; padding:12px; border:1px solid #ddd; border-radius:4px; box-sizing:border-box; }
    </style>
</head>
<body>

<header>
    <div class="header-inner">
        <a href="index.html"><img src="images/UMAT-e1673627924885.png" alt="UMAT Logo" class="logo-img"></a>
        <button class="mobile-menu-btn" onclick="document.querySelector('.main-nav').classList.toggle('active')">☰</button>
        <nav class="main-nav">
            <a href="index.html" class="nav-link">Home</a>
            <a href="events.html" class="nav-link">Events</a>
            <a href="about.html" class="nav-link">About</a>
            <a href="contact.html" class="nav-link active">Contact</a>
            <a href="https://www.justgiving.com/crowdfunding/umatcommunity" class="nav-donate">Donate</a>
        </nav>
    </div>
</header>

<div class="container" style="max-width:600px; margin-top:60px;">
    <div style="background:white; padding:40px; border-radius:12px; box-shadow:0 10px 30px rgba(0,0,0,0.05);">
        <h1 style="text-align:center; margin-top:0; color:var(--dark);">Get in Touch</h1>
        <p style="text-align:center; color:#666; margin-bottom:30px;">Interested in performing or sponsoring an event?</p>
        <form action="mailto:contact@umat.org.uk" method="post" enctype="text/plain">
            <div class="form-group"><label>Name</label><input type="text" name="name" required></div>
            <div class="form-group"><label>Email</label><input type="email" name="email" required></div>
            <div class="form-group"><label>Message</label><textarea name="message" rows="5" required></textarea></div>
            <button type="submit" class="btn-red" style="width:100%; border:none; cursor:pointer;">Send Message</button>
        </form>
    </div>
</div>

<footer><p>© 2026 Unity Music Arts Team CIC</p></footer>
</body>
</html>
