# cloudcannon.config.yml
collections_config:
  pages:
    path: .
    glob: ["*.html"]
    url: "/[path]"
    output: true

paths:
  uploads: images

# This setting helps when you can't click text because of overlays
editor:
  default_path: /index.html
  preview_wrapper_class: editable
  entity_classes:
    editable:
      allow_resize: false
      allow_add: true
      allow_remove: true

_inputs:
  date:
    type: date
    instance_value: now
  image:
    type: image
    options:
      width: 800
      height: 600
      fit: cover