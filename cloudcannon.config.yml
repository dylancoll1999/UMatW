# cloudcannon.config.yml

# 1. Where images go
paths:
  uploads: images

# 2. Tell CloudCannon your HTML files are "Pages" (THIS FIXES YOUR ERROR)
collections_config:
  pages:
    path: .
    glob: ["*.html"]
    url: "/[path]"
    output: true

# 3. Editor Settings (Date pickers, Image resizers)
_inputs:
  date:
    type: date
    instance_value: now
  image:
    type: image
    options:
      width: 800
      height: 600
      fit: cover

# 4. Visual Editor "Drag & Drop" Settings
editor:
  default_path: /index.html
  entity_classes:
    editable:
      allow_resize: false
      allow_add: true
      allow_remove: true